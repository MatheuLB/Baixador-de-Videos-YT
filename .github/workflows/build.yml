# Gera o app para Windows, macOS (Apple Silicon e Intel) e Linux.
#
# - Em cada push/PR: os pacotes ficam disponíveis em "Actions" > execução > "Artifacts".
# - Ao criar uma tag v* (ex.: git tag v1.0.0 && git push origin v1.0.0):
#   além disso, é criada uma Release no GitHub com todos os instaladores.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux x64
            os: ubuntu-22.04 # glibc mais antiga = roda em mais distribuições
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Dependências Python
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Testes
        run: python -m pytest -q

      - name: Gerar o app (PyInstaller)
        run: pyinstaller --noconfirm --clean baixador.spec

      - name: Conferir se o app abre
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP=dist/Baixador.app/Contents/MacOS/Baixador
          elif [ "$RUNNER_OS" = "Windows" ]; then
            APP=dist/Baixador/Baixador.exe
          else
            APP=dist/Baixador/Baixador
          fi
          QT_QPA_PLATFORM=offscreen "$APP" --smoke-test

      - name: Empacotar
        run: python scripts/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: Baixador-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publicar release
    # Publica o que deu certo, mesmo que uma das plataformas tenha falhado.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
