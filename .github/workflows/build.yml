# Gera o app para Windows, macOS (Apple Silicon e Intel) e Linux.
#
# - Em cada push/PR: os pacotes ficam disponíveis em "Actions" > execução > "Artifacts".
# - Publicar uma versão nova: mude __version__ em baixador/__init__.py e envie para a
#   main. Se essa versão ainda não tem release, o workflow cria a tag (ex.: v1.0.1)
#   e a Release com todos os instaladores. Enviar uma tag v* também publica.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo na mesma branch cancela o build anterior, que ficou desatualizado.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
          - name: Linux x64
            os: ubuntu-22.04 # glibc mais antiga = roda em mais distribuições
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libfontconfig1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Dependências Python
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Testes
        run: python -m pytest -q

      - name: Gerar o app (PyInstaller)
        run: pyinstaller --noconfirm --clean baixador.spec

      - name: Conferir se o app abre
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP=dist/Baixador.app/Contents/MacOS/Baixador
          elif [ "$RUNNER_OS" = "Windows" ]; then
            APP=dist/Baixador/Baixador.exe
          else
            APP=dist/Baixador/Baixador
          fi
          QT_QPA_PLATFORM=offscreen "$APP" --smoke-test

      - name: Empacotar
        run: python scripts/package.py

      - uses: actions/upload-artifact@v4
        with:
          name: Baixador-${{ runner.os }}-${{ runner.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publicar release
    # Publica o que deu certo, mesmo que uma das plataformas tenha falhado.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ver se esta versão já foi publicada
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('baixador/__init__.py').read()).group(1))")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/tags/v$VERSION" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "A versão $VERSION já tem release; nada a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Baixador de Vídeos ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
